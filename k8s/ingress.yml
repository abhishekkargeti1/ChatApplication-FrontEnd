apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-app-ingress
  namespace: chat-app
  annotations:
    # Set HTTP 1.1 and upgrade headers for WebSockets
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

    # Timeouts for persistent WebSocket connections
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    # Session affinity (sticky sessions required for SockJS polling fallbacks)
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # 1. Frontend Route (Updated path to match Vite base /chatapp/)
      - path: /chatapp
        pathType: Prefix
        backend:
          service:
            name: chat-app-frontend-service
            port:
              number: 80

      # 2. REST API Route
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: chat-app-backend-service
            port:
              number: 8080

      # 3. SockJS / WebSocket Endpoint
      - path: /chat
        pathType: Prefix
        backend:
          service:
            name: chat-app-backend-service
            port:
              number: 8080