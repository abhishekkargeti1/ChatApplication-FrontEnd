server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Handle assets and routes under /chatapp/
    location /chatapp/ {
        # Using $request_filename allows try_files to map path requests correctly with alias
        alias /usr/share/nginx/html/;
        try_files $1 $1/ /index.html;
    }

    # Redirect /chatapp to /chatapp/
    location = /chatapp {
        return 301 /chatapp/;
    }

    # Fallback SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}