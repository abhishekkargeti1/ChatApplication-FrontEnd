server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Direct access /chatapp to /chatapp/
    location = /chatapp {
        return 301 /chatapp/;
    }

    # Serve requests under /chatapp/ and fallback to index.html for React Router
    location /chatapp/ {
        try_files $uri $uri/ /index.html;
    }

    # General fallback for root requests
    location / {
        try_files $uri $uri/ /index.html;
    }
}