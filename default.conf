server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Direct /chatapp/ requests to the root directory where static assets reside
    location /chatapp/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /chatapp/index.html;
    }

    location = /chatapp {
        return 301 /chatapp/;
    }
}